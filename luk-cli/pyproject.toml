[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luk-cli"
dynamic = ["version"]
description = "Read-only personal CLI and Claude Code plugin for Luk (takealuk.com)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Ostertag" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    # imported directly (click.Choice, click.echo); typer >= 0.27 vendors click and no longer installs it.
    "click>=8.1",
    "rich>=13",
    "httpx>=0.27,<0.29",
    "pydantic>=2.6,<3",
    "selectolax>=0.4,<0.5",
    "platformdirs>=4",
    "filelock>=3.12",
    "playwright>=1.44",
    # zoneinfo has no system tz database on Windows; America/Santiago dates (§5.2, §5.4) need it.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=7"]

[project.scripts]
luk = "luk_cli.cli:main"

[tool.hatch.version]
path = "src/luk_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luk_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "synthetic: runs against a synthetic fixture (spec §8.1), to be regenerated from real markup",
]
