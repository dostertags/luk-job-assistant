<!DOCTYPE html>
<html class="h-full bg-primary font-sans" lang="es-CL">
  <head>

    <title>Mis CVs - Luk</title>
    <meta name="csrf-param" content="authenticity_token" />
<meta name="csrf-token" content="SCRUBBED" />

    </div>
</header>

      <main class="app-layout-main">
        <div class="account-content stack-lg">
          <h1 class="heading-lg">Mis CVs</h1>
          <p class="text-body text-gray">Sube tu CV en formato .pdf o .docx (máximo 5 MB).</p>

          <div class="stack-md">
            <div class="card cv-card">

                <a href="/rails/active_storage/blobs/redirect/SCRUBBED/cv-1.pdf?disposition=attachment" class="btn-default btn-sm">Descargar</a>

              </div>
              <div class="cv-card__actions">
                <a href="/rails/active_storage/blobs/redirect/SCRUBBED/cv-2.docx?disposition=attachment" class="btn-default btn-sm">Descargar</a>
              </div>
            </div>
          </div>

          <form action="/profile/cvs" method="post" enctype="multipart/form-data" class="card stack-sm">
            <input type="hidden" name="authenticity_token" value="SCRUBBED" autocomplete="off" />

            <button type="submit" class="btn-primary btn-sm">Subir</button>
          </form>
        </div>
