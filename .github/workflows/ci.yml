name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the three packages
        run: |
          python -m pip install -U pip
          python -m pip install -e "./luk-cli[mcp,dev]" -e "./luk-scraper[dev]" -e "./luk-assist[dev]"
      # Tests are offline: fixtures and fakes only, no network, no browser.
      # Each package runs even if an earlier one failed, so one run shows every failure.
      - name: luk-cli
        working-directory: luk-cli
        run: python -m pytest -q
      - name: luk-scraper
        if: ${{ !cancelled() }}
        working-directory: luk-scraper
        run: python -m pytest -q
      - name: luk-assist
        if: ${{ !cancelled() }}
        working-directory: luk-assist
        run: python -m pytest -q

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
