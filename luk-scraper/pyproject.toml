[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luk-scraper"
dynamic = ["version"]
description = "Polite crawler that exports Luk's (takealuk.com) public job offers to JSONL/CSV"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Ostertag" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
luk-scraper = "luk_scraper.cli:main"

[tool.hatch.version]
path = "src/luk_scraper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luk_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
